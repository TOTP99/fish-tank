<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>🐢 3D生态缸</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#04141d;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  canvas{display:block}
  /* —— 顶部工具条：水质 + 工具箱 + 版权开关 同一行 —— */
  #topBar{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:6;
    display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
  #dash{position:relative}
  #dashPill{display:flex;align-items:center;gap:7px;border:1px solid rgba(120,190,205,.35);
    border-radius:999px;background:rgba(8,18,26,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#d9f4f7;font-size:11px;font-weight:800;padding:7px 12px;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.3)}
  #dashPill:active{transform:scale(.94)}
  #dashPill .dot{width:8px;height:8px;border-radius:50%;background:#3dcc7a}
  #dashPill.warn{border-color:rgba(255,90,70,.75);animation:pillPulse 1.2s infinite}
  @keyframes pillPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,70,.55)}50%{box-shadow:0 0 0 7px rgba(255,90,70,0)}}
  #dashPanel{display:none;margin-top:6px;background:rgba(8,18,26,.72);
    border:1px solid rgba(111,190,205,.35);border-radius:14px;padding:10px 12px;min-width:180px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 22px rgba(0,0,0,.4)}
  #dash.open #dashPanel{display:block}
  .drow{display:flex;align-items:center;gap:6px;margin:4px 0}
  .drow .lab{font-size:10px;color:#9fb8bd;width:2em;font-weight:700}
  .dbar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
  .dbar>i{display:block;height:100%;border-radius:3px;transition:width .4s}
  .dval{font-size:10px;color:#eef6f8;width:3em;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  #dash .meta{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:#eef6f8;font-weight:700}
  #advice{margin-top:4px;font-size:10px;color:#e0b25a;font-weight:700;line-height:1.4;max-width:180px}
  /* 工具箱按钮 / 版权开关：与水质同风格的小药丸 */
  .topBtn{display:flex;align-items:center;gap:5px;border:1px solid rgba(120,190,205,.35);
    border-radius:999px;background:rgba(8,18,26,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#d9f4f7;font-size:11px;font-weight:800;padding:7px 12px;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap;flex:0 0 auto}
  .topBtn:active{transform:scale(.94)}
  .topBtn.on{border-color:rgba(125,211,252,.55);background:rgba(40,90,120,.55);color:#b8e8ff}
  /* —— 顶部警报 —— */
  #alert{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:7;
    pointer-events:none;font-size:12px;font-weight:800;color:#fff;white-space:nowrap;
    background:rgba(180,40,30,.92);padding:7px 15px;border-radius:11px;
    opacity:0;transition:opacity .3s;box-shadow:0 4px 16px rgba(180,40,30,.4)}
  #alert.show{opacity:1}
  /* —— 事件 toast —— */
  #toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;
    pointer-events:none;font-size:12px;font-weight:800;color:#fff;white-space:nowrap;
    background:rgba(20,80,60,.92);padding:8px 16px;border-radius:12px;
    opacity:0;transition:opacity .25s,transform .25s}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  #credit{position:fixed;left:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;color:rgba(255,255,255,.42);
    font-size:10px;line-height:1.5;max-width:60vw;pointer-events:none;display:none}
  #credit.show{display:block}
  #hint{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;
    color:rgba(255,255,255,.85);font-size:12px;background:rgba(2,20,30,.45);padding:6px 14px;border-radius:999px;
    transition:opacity 1.5s;pointer-events:none;white-space:nowrap}
  /* —— 工具栏弹窗 —— */
  #sheetBg{position:fixed;inset:0;z-index:8;background:rgba(2,12,20,.5);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .3s}
  #sheetBg.open{opacity:1;pointer-events:auto}
  #sheet{position:fixed;z-index:9;left:50%;top:50%;width:min(300px,86vw);
    display:flex;flex-direction:column;overflow:hidden;
    transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;
    transition:transform .32s cubic-bezier(.2,1.4,.4,1),opacity .25s;
    background:linear-gradient(165deg,rgba(23,52,70,.96),rgba(7,22,33,.97));
    border:1px solid rgba(140,200,235,.28);border-radius:24px;
    box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(64,140,190,.15),inset 0 1px 0 rgba(255,255,255,.12);
    padding:16px 14px 14px;box-sizing:border-box}
  #sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px;flex:0 0 auto}
  .sheet-title{color:#dceefb;font-size:14px;letter-spacing:.2em;font-weight:600}
  .sheet-title small{display:block;font-size:9px;letter-spacing:.1em;color:rgba(220,238,251,.45);font-weight:400;margin-top:2px}
  #sheetX{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.07);color:rgba(255,255,255,.75);font-size:13px;cursor:pointer;flex:0 0 auto}
  #sheetX:active{transform:scale(.9)}
  .sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 6px;justify-items:center;padding:2px 0 4px}
  /* 3×3 小圆按钮：圆形图标 + 下方文字 */
  .tile{display:flex;flex-direction:column;align-items:center;gap:6px;
    width:78px;padding:0;border:none;background:transparent;cursor:pointer;color:#fff;
    transition:transform .12s}
  .tile:active{transform:scale(.9)}
  .tile .t-ico{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:700;letter-spacing:.05em;line-height:1;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    box-shadow:0 4px 14px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.1);
    transition:background .2s,border-color .2s,box-shadow .2s}
  .tile .t-name{font-size:11px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.88)}
  .tile .t-sub{display:none}
  .tile.toggle.on .t-ico{background:rgba(56,140,200,.35);border-color:rgba(125,211,252,.65);
    box-shadow:0 0 16px rgba(80,170,230,.35),inset 0 1px 0 rgba(255,255,255,.12)}
  .tile.toggle.on .t-name{color:#b8e8ff}
  .tile.danger .t-ico{border-color:rgba(255,120,90,.5);background:rgba(180,50,30,.18)}
  .tile.danger .t-name{color:#ffb3a0}
  .sheet-foot{flex:0 0 auto;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);
    font-size:10px;color:rgba(255,255,255,.4);line-height:1.7;text-align:center}
  .sheet-foot .reset-link{display:inline-block;margin-top:6px;padding:5px 14px;border-radius:999px;
    border:1px solid rgba(255,120,90,.4);color:#ffb3a0;font-size:11px;font-weight:700;cursor:pointer;
    background:rgba(180,50,30,.12)}
  .sheet-foot .reset-link:active{transform:scale(.95)}
  #loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:#04141d;color:#9fd8ff;font-size:15px;letter-spacing:.2em;transition:opacity .8s}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="loading">正在注水…</div>
<script>
window.__bootT=setTimeout(function(){
  var l=document.getElementById('loading');
  if(l&&!window.__tank)l.innerHTML='加载失败<br><small>1. 请用 HTTP 托管(如 GitHub Pages)打开，file:// 直接打不开<br>2. 需要联网加载 three.js CDN</small>';
},15000);
window.addEventListener('error',function(e){
  var l=document.getElementById('loading');
  if(l&&!window.__tank)l.innerHTML='加载出错<br><small>'+(e.message||'未知错误')+'</small>';
});
</script>
<div id="topBar">
  <div id="dash">
    <button id="dashPill" aria-label="水状态"><span class="dot" id="dQ"></span><span class="dot" id="dO"></span><span class="dot" id="dW"></span><span id="dashMini">--</span></button>
    <div id="dashPanel">
      <div class="drow"><span class="lab">水质</span><span class="dbar"><i id="qFill"></i></span><span class="dval" id="qVal">--</span></div>
      <div class="drow"><span class="lab">氧气</span><span class="dbar"><i id="oFill"></i></span><span class="dval" id="oVal">--</span></div>
      <div class="drow"><span class="lab">废物</span><span class="dbar"><i id="wFill"></i></span><span class="dval" id="wVal">--</span></div>
      <div class="meta"><span id="fishVal">鱼 --</span><span id="dayVal">昼</span><span id="filterVal">过滤开</span></div>
      <div id="advice"></div>
    </div>
  </div>
  <button class="topBtn" id="bToolbox" aria-label="打开鱼缸管家">工具箱</button>
  <button class="topBtn" id="bCredit" aria-label="显示版权">署名</button>
</div>
<div id="alert"></div>
<div id="toast"></div>
<div id="credit">引擎改编自 joewolly/aquarium · 乌龟模型 CC-BY-SA 4.0 ©lucas B. · 锦鲤模型 CC-BY 4.0 ©FlanCasero</div>
<div id="hint">点水面投食 · 点水草互动 · 点工具箱/长按开管家 · 拖动旋转</div>
<div id="sheetBg"></div>
<div id="sheet" role="dialog" aria-label="鱼缸管家">
  <div class="sheet-head">
    <div class="sheet-title">🐢 鱼缸管家<small>AQUARIUM CONTROLS</small></div>
    <button id="sheetX" aria-label="关闭">✕</button>
  </div>
  <div class="sheet-grid">
    <button class="tile" id="bFeed"><span class="t-ico">食</span><span class="t-name">投食</span></button>
    <button class="tile" id="bFish"><span class="t-ico">鱼</span><span class="t-name">加鱼</span></button>
    <button class="tile" id="bWater"><span class="t-ico">水</span><span class="t-name">换水</span></button>
    <button class="tile toggle on" id="bFilter"><span class="t-ico">滤</span><span class="t-name">过滤</span></button>
    <button class="tile toggle on" id="bDay"><span class="t-ico">昼</span><span class="t-name">昼夜</span></button>
    <button class="tile toggle on" id="bFx"><span class="t-ico">效</span><span class="t-name">特效</span></button>
    <button class="tile" id="bTrim"><span class="t-ico">剪</span><span class="t-name">修剪</span></button>
    <button class="tile danger" id="bFrenzy"><span class="t-ico">暴</span><span class="t-name">狂暴</span></button>
    <button class="tile" id="bFs"><span class="t-ico">屏</span><span class="t-name">全屏</span></button>
  </div>
  <div class="sheet-foot">
    <div>投食→排泄→水质；水草+过滤净化；吃饱可产卵</div>
    <span class="reset-link" id="bReset">重置鱼缸</span>
  </div>
</div>
<script type="module" src="./js/tank.js"></script>
</body>
</html>
